name: Refrescar cartelera

# Corre EN LA NUBE, en las maquinas de GitHub. La laptop de Cesar puede estar
# apagada: la cartelera se actualiza igual. Repo publico = minutos gratis.
#
# Horas: las mismas cinco de siempre en hora de Lima (07, 08, 11, 17, 20).
# GitHub programa en UTC y Lima es UTC-5, asi que aqui van 12, 13, 16, 22 y 01.
# Peru no tiene horario de verano: la conversion no cambia en todo el ano.
on:
  schedule:
    - cron: "10 1,12,13,16,22 * * *"
  workflow_dispatch:        # boton "Run workflow" para dispararlo a mano

permissions:
  contents: write           # lo justo para hacer commit del JSON

concurrency:
  group: cartelera          # dos pasadas a la vez chocarian al hacer push
  cancel-in-progress: false

jobs:
  refrescar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # El cache va al temporal del runner, FUERA del repo. No es comodidad: hace
      # imposible que un archivo del cache acabe en un repo publico por descuido.
      TABLERO_CACHE: ${{ runner.temp }}/cache
      TABLERO_NUBE: "1"
      # Opcionales. Si no estan cargados como secrets del repo, la cartelera sale
      # igual (cines, formatos y horarios) pero sin sinopsis ni resenas.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright (solo Chromium)
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Side-cache de Cineplanet
        # Cineplanet publica su cartelera con JavaScript: sin navegador no hay dato.
        # Si falla, NO se corta la pasada — el paso siguiente sigue con las otras
        # dos fuentes y la pagina rotula a Cineplanet como no consultado.
        continue-on-error: true
        run: python bot/refrescar_cineplanet.py cajamarca

      - name: Scrapear la cartelera
        run: python bot/bloque_cines.py cajamarca

      - name: Publicar solo si mejora lo que ya hay
        run: |
          python bot/publicar_nube.py \
            "$TABLERO_CACHE/cines_cajamarca.json" \
            data/cines_cajamarca.json

      - name: Commit
        run: |
          if git diff --quiet -- data/cines_cajamarca.json; then
            echo "Sin cambios: no hay nada que commitear."
            exit 0
          fi
          git config user.name "cartelera-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cines_cajamarca.json
          git commit -m "Cartelera actualizada (nube)"
          git push
